name: Deploy Backend Service

on:
  push:
    branches: [ main, master ]
    paths:
      - 'petmanagement_backend_rajalakshmi/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'petmanagement_backend_rajalakshmi/**'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/petmanagement-backend

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./petmanagement_backend_rajalakshmi

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test || echo "No tests defined"

    - name: Check linting
      run: npm run lint || echo "No lint script"

    - name: Check API health
      run: |
        npm start &
        sleep 10
        curl -f http://localhost:8000/ || exit 1
        pkill -f "node.*server.js" || true

  # Build and Push Backend Image
  build-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./petmanagement_backend_rajalakshmi
        file: ./petmanagement_backend_rajalakshmi/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy Backend to Production
  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy backend to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # Navigate to backend deployment directory
          cd /opt/petmanagement/backend

          # Backup current deployment
          echo "Creating backend backup..."
          mkdir -p backups
          tar -czf backups/backend-backup-$(date +%Y%m%d_%H%M%S).tar.gz docker-compose.yml .env

          # Update docker-compose.yml with latest backend image
          sed -i "s|image:.*petmanagement-backend.*|image: ${{ env.BACKEND_IMAGE }}:latest|g" docker-compose.yml

          # Pull latest backend image
          echo "Pulling latest backend image..."
          docker-compose pull backend

          # Restart backend service
          echo "Restarting backend service..."
          docker-compose up -d backend

          # Wait for backend to start
          echo "Waiting for backend to start..."
          sleep 20

          # Health check
          echo "Performing backend health check..."
          if curl -f http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ Backend deployment successful!"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi

    - name: Notify backend deployment success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "Pet Management Backend deployed successfully to production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify backend deployment failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "Pet Management Backend deployment failed"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
