name: Deploy to Production Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/petmanagement-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/petmanagement-frontend

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production server via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # Navigate to deployment directory
          cd /opt/petmanagement

          # Backup current deployment
          echo "Creating backup..."
          mkdir -p backups
          tar -czf backups/backup-$(date +%Y%m%d_%H%M%S).tar.gz docker-compose.yml .env

          # Update docker-compose.yml with latest images
          sed -i "s|image:.*petmanagement-backend.*|image: ${{ env.BACKEND_IMAGE }}:latest|g" docker-compose.yml
          sed -i "s|image:.*petmanagement-frontend.*|image: ${{ env.FRONTEND_IMAGE }}:latest|g" docker-compose.yml

          # Pull latest images
          echo "Pulling latest images..."
          docker-compose pull

          # Stop existing containers gracefully
          echo "Stopping existing containers..."
          docker-compose down --timeout 30

          # Start new containers
          echo "Starting new containers..."
          docker-compose up -d

          # Wait for services to be healthy
          echo "Waiting for services to start..."
          sleep 30

          # Health check
          echo "Performing health checks..."
          if curl -f http://localhost:8000/ > /dev/null 2>&1; then
            echo "✅ Backend is healthy"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi

          if curl -f http://localhost:8080/ > /dev/null 2>&1; then
            echo "✅ Frontend is healthy"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -f

          echo "✅ Deployment completed successfully!"

    - name: Notify deployment success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "Pet Management Application deployed successfully to production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify deployment failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "Pet Management Application deployment failed"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}