name: Deploy Frontend Service

on:
  push:
    branches: [ main, master ]
    paths:
      - 'petmanagement_frontend_rajalakshmi/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'petmanagement_frontend_rajalakshmi/**'

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/petmanagement-frontend

jobs:
  # Test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./petmanagement_frontend_rajalakshmi

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test -- --watch=false --browsers=ChromeHeadless || echo "No tests defined"

    - name: Check linting
      run: npm run lint || echo "No lint script"

    - name: Build application
      run: npm run build

    - name: Check build output
      run: ls -la dist/petmanagement/

  # Build and Push Frontend Image
  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./petmanagement_frontend_rajalakshmi
        file: ./petmanagement_frontend_rajalakshmi/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy Frontend to Production
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy frontend to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        port: ${{ secrets.PRODUCTION_PORT || 22 }}
        script: |
          # Navigate to frontend deployment directory
          cd /opt/petmanagement/frontend

          # Backup current deployment
          echo "Creating frontend backup..."
          mkdir -p backups
          tar -czf backups/frontend-backup-$(date +%Y%m%d_%H%M%S).tar.gz docker-compose.yml

          # Update docker-compose.yml with latest frontend image
          sed -i "s|image:.*petmanagement-frontend.*|image: ${{ env.FRONTEND_IMAGE }}:latest|g" docker-compose.yml

          # Pull latest frontend image
          echo "Pulling latest frontend image..."
          docker-compose pull frontend

          # Restart frontend service
          echo "Restarting frontend service..."
          docker-compose up -d frontend

          # Wait for frontend to start
          echo "Waiting for frontend to start..."
          sleep 15

          # Health check
          echo "Performing frontend health check..."
          if curl -f http://localhost:8080/ > /dev/null 2>&1; then
            echo "✅ Frontend deployment successful!"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

    - name: Notify frontend deployment success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "Pet Management Frontend deployed successfully to production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify frontend deployment failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "Pet Management Frontend deployment failed"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
