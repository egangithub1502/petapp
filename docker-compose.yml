version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: petmanagement-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: petmanagement
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - petmanagement-network

  # Backend API Service
  backend:
    build:
      context: ./petmanagement_backend_rajalakshmi
      dockerfile: Dockerfile
    container_name: petmanagement-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./petmanagement_backend_rajalakshmi/.env
    depends_on:
      - mongodb
    networks:
      - petmanagement-network
    volumes:
      - ./petmanagement_backend_rajalakshmi:/app
      - /app/node_modules

  # Frontend Application
  frontend:
    build:
      context: ./petmanagement_frontend_rajalakshmi
      dockerfile: Dockerfile
    container_name: petmanagement-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - petmanagement-network

volumes:
  mongodb_data:
  mongodb_config:

networks:
  petmanagement-network:
    driver: bridge